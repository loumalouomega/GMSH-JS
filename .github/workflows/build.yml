name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Pinned Emscripten SDK (keyed on the pinned version in scripts/env.sh).
      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('scripts/env.sh', 'scripts/setup-emsdk.sh') }}

      - name: Setup emsdk
        run: bash scripts/setup-emsdk.sh

      # OCCT WASM build is slow and changes rarely: cache the install prefix.
      - name: Cache OCCT (WASM install)
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: build/occt-install
          key: occt-${{ runner.os }}-${{ hashFiles('scripts/env.sh', 'scripts/build-occt.sh') }}

      - name: Build OCCT (WASM)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-occt.sh

      - name: Build gmsh WASM + assemble dist
        run: bash scripts/build-wasm.sh

      - name: Verify generated bindings are in sync
        run: |
          bash scripts/gen-bindings.sh
          git diff --exit-code generated/ \
            || (echo "generated/ is stale — re-run scripts/gen-bindings.sh and commit" && exit 1)

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Test (Node)
        run: npm test

      - name: Test (browser)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
